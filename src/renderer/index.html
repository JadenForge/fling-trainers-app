<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://flingtrainer.com file:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>风灵月影修改器合集</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 顶部导航 -->
    <header class="topbar">
      <div class="brand">
        <div class="logo">FL</div>
        <div class="brand-text">
          <strong>风灵月影修改器合集</strong>
          <span id="brandSub">正在载入…</span>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="all">全部修改器</button>
        <button class="tab" data-tab="fav">我的收藏<span class="badge" id="badgeFav" hidden>0</span></button>
        <button class="tab" data-tab="dl">我的下载<span class="badge" id="badgeDl" hidden>0</span></button>
        <button class="tab" data-tab="settings">设置</button>
      </nav>
    </header>

    <!-- 主页（全部/收藏/下载 共用） -->
    <main id="viewMain">
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
          <input id="search" type="search" placeholder="搜索修改器（输入游戏中文名或英文名）" autocomplete="off" spellcheck="false" />
          <button id="searchClear" class="search-clear" title="清空" hidden>×</button>
        </div>
        <div class="chips" id="chips">
          <button class="chip chip-action" id="btnRefresh" data-act="refresh">刷新列表</button>
          <button class="chip" data-sort="updated">最近更新</button>
          <button class="chip" data-sort="published">最新发布</button>
          <button class="chip" data-sort="recent">最近使用</button>
        </div>
      </div>

      <div class="list-head">
        <span id="listCount">—</span>
        <span class="list-hint" id="listHint"></span>
      </div>

      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden></div>
      <nav id="pager" class="pager" hidden></nav>
    </main>

    <!-- 设置页 -->
    <main id="viewSettings" hidden>
      <div class="settings">
        <section class="card-sec">
          <h2>路径设置</h2>
          <div class="row">
            <label>本地修改器目录<small>点击「运行」时在这里查找对应的修改器程序</small></label>
            <div class="field">
              <input id="setTrainersDir" type="text" readonly placeholder="尚未设置" />
              <button class="btn" id="pickTrainersDir">选择…</button>
              <button class="btn ghost" id="openTrainersDir">打开</button>
            </div>
          </div>
          <div class="row">
            <label>下载保存目录<small>下载的修改器压缩包会存到这里</small></label>
            <div class="field">
              <input id="setDownloadDir" type="text" readonly placeholder="默认：下载/风灵月影修改器" />
              <button class="btn" id="pickDownloadDir">选择…</button>
              <button class="btn ghost" id="openDownloadDir">打开</button>
            </div>
          </div>
        </section>

        <section class="card-sec">
          <h2>显示与行为</h2>
          <div class="row inline">
            <label>卡片尺寸</label>
            <div class="seg" id="segSize">
              <button data-size="sm">小</button>
              <button data-size="md" class="on">中</button>
              <button data-size="lg">大</button>
            </div>
          </div>
          <div class="row inline">
            <label>进度条开关</label>
            <div class="seg" id="segCover">
              <button data-cover="0" class="on">在线加载封面</button>
              <button data-cover="1">缓存封面到本地</button>
            </div>
          </div>
          <div class="row inline">
            <label>显示已「删除」的条目</label>
            <div class="seg" id="segHidden">
              <button data-hidden="0" class="on">隐藏</button>
              <button data-hidden="1">显示</button>
            </div>
          </div>
        </section>

        <section class="card-sec">
          <h2>数据</h2>
          <div class="row inline">
            <label>修改器数据<small id="dataMeta">—</small></label>
            <div class="field">
              <button class="btn" id="btnRefreshFull">从主站完整刷新</button>
              <button class="btn ghost" id="btnRefreshQuick">增量更新</button>
            </div>
          </div>
          <div class="row inline">
            <label>重置本地记录<small>清空收藏、下载记录与设置</small></label>
            <div class="field"><button class="btn danger" id="btnReset">重置</button></div>
          </div>
        </section>

        <section class="card-sec">
          <h2>关于</h2>
          <p class="about" id="about">—</p>
        </section>
      </div>
    </main>

    <!-- 详情抽屉 -->
    <aside id="drawer" class="drawer" hidden>
      <div class="drawer-head">
        <h3 id="dTitle">—</h3>
        <button class="icon-btn" id="dClose" title="关闭">×</button>
      </div>
      <div class="drawer-body" id="dBody"></div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <!-- 底部状态条 -->
    <footer class="statusbar">
      <div class="status-left">
        <span id="statusText">就绪</span>
      </div>
      <div class="status-right">
        <div class="progress" id="progressWrap" hidden><div class="progress-bar" id="progressBar"></div></div>
        <span id="statusRight"></span>
      </div>
    </footer>

    <div id="toasts" class="toasts"></div>
    <div id="confirm" class="modal" hidden>
      <div class="modal-box">
        <h3 id="cfTitle">确认</h3>
        <p id="cfText"></p>
        <div class="modal-actions">
          <button class="btn ghost" id="cfNo">取消</button>
          <button class="btn danger" id="cfYes">确定</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
